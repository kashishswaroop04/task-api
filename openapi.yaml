
openapi: 3.0.3

info:
  title: Task API
  version: 1.1.0
  description: Task API with authentication and task status filtering.

servers:
  - url: /
    description: Current API server

tags:
  - name: Authentication
  - name: Tasks
  - name: Admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Finish homework
        completed:
          type: boolean
          example: false
        userId:
          type: integer
          example: 1

    TaskInput:
      type: object
      required: [title, completed]
      properties:
        title:
          type: string
          minLength: 5
          example: Finish homework
        completed:
          type: boolean
          example: false

    TaskUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 5
        completed:
          type: boolean

    Error:
      type: object
      properties:
        errors:
          description: Error message or validation messages
          oneOf:
            - type: string
            - type: array
              items:
                type: string

  parameters:
    completed:
      name: completed
      in: query
      required: false
      description: Filter tasks by completion status.
      schema:
        type: string
        enum: ['true', 'false']

  responses:
    BadCompleted:
      description: Invalid completed query parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errors:
              - completed must be true or false

    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Access forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Task not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /api/auth/signup:
    post:
      tags: [Authentication]
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: User created
        '400':
          description: Invalid signup information
        '409':
          description: Email already registered

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /tasks:
    get:
      tags: [Tasks]
      summary: Get all tasks
      description: |
        Returns tasks with an optional completed filter.
        Without the parameter, all tasks are returned.
        completed=true returns completed tasks.
        completed=false returns incomplete tasks.
        Invalid values return HTTP 400.
      security: []
      parameters:
        - $ref: '#/components/parameters/completed'
      responses:
        '200':
          description: Array of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadCompleted'

  /api/tasks:
    get:
      tags: [Tasks]
      summary: Get current user's tasks
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/completed'
      responses:
        '200':
          description: Array of user tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadCompleted'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Tasks]
      summary: Create a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid task data
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1

    get:
      tags: [Tasks]
      summary: Get task by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Tasks]
      summary: Update task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid task data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Tasks]
      summary: Delete task
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Task deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/tasks:
    get:
      tags: [Admin]
      summary: Get all tasks as admin
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/completed'
      responses:
        '200':
          description: Array of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadCompleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
